<svg width="320" height="40" viewBox="0 0 320 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect width="320" height="40" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Combined wallet + AI icon on the left -->
  <g transform="translate(12, 8)">
    <!-- Wallet base -->
    <rect x="0" y="6" width="16" height="12" rx="2" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <!-- Wallet flap -->
    <rect x="1" y="4" width="14" height="8" rx="1.5" fill="rgba(255,255,255,0.8)"/>
    <!-- Card slot -->
    <rect x="3" y="10" width="8" height="1.5" fill="rgba(99,102,241,0.9)"/>
    <!-- Chip -->
    <rect x="12" y="13" width="2.5" height="2" rx="0.5" fill="rgba(99,102,241,1)"/>
    
    <!-- AI brain overlay -->
    <circle cx="18" cy="12" r="6" fill="rgba(139,92,246,0.9)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <!-- Neural nodes -->
    <circle cx="16" cy="10" r="1" fill="white"/>
    <circle cx="20" cy="10" r="1" fill="white"/>
    <circle cx="18" cy="14" r="0.8" fill="rgba(255,255,255,0.9)"/>
    <!-- Neural connections -->
    <line x1="16" y1="10" x2="18" y2="14" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
    <line x1="20" y1="10" x2="18" y2="14" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
  </g>
  
  <!-- Main prominent text -->
  <text x="56" y="16" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5px">
    x402 × Agentic AI
  </text>
  
  <!-- Subtitle text -->
  <text x="56" y="28" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="0.3px">
    with Smart Wallet
  </text>
</svg>
